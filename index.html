<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página en GitHub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #24292e;
            margin-bottom: 10px;
        }
        p {
            color: #586069;
            font-size: 1.1em;
            line-height: 1.5;
        }
        .btn {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Funciona correctamente! 🚀</h1>
        <p>Esta es una página de prueba creada para estrenar mi alojamiento gratuito en <strong>GitHub Pages</strong>.</p>
        <button class="btn" onclick="celebrar()">¡Hacer clic aquí!</button>
    </div>

    <script>
        function celebrar() {
            alert('¡Felicidades! Tu código HTML, CSS y JavaScript está corriendo en vivo desde GitHub. 🎉');
        }
    </script>

</body>
</html>
